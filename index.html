<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>พัสดุพิเศษถึงน้องด้าย 🌷</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Mali:wght@300;400;600;700&family=Dancing+Script:wght@600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
      :root {
        --plum: #2b1033;
        --wine: #5a1d4a;
        --rose: #ff7aa8;
        --blush: #ffd6e3;
        --cream: #fff3f7;
        --gold: #ffd28a;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
      }

      body {
        font-family: 'Mali', 'Sarabun', sans-serif;
        color: var(--cream);
        overflow: hidden;
        background: radial-gradient(
          120% 90% at 50% 110%,
          #c2457d 0%,
          var(--wine) 38%,
          var(--plum) 75%
        );
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        -webkit-tap-highlight-color: transparent;
      }

      canvas#fx {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      .glow {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 72vmin;
        height: 72vmin;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(255, 122, 168, 0.28),
          transparent 65%
        );
        animation: breathe 5s ease-in-out infinite;
        pointer-events: none;
        z-index: 0;
      }

      @keyframes breathe {
        50% {
          transform: translate(-50%, -50%) scale(1.22);
          opacity: 0.72;
        }
      }

      .scene {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 28px;
        z-index: 1;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.9s ease, visibility 0.9s;
      }

      .scene.on {
        opacity: 1;
        visibility: visible;
      }

      .script {
        font-family: 'Dancing Script', cursive;
        font-size: clamp(34px, 9vw, 54px);
        color: var(--blush);
        text-shadow: 0 0 24px rgba(255, 122, 168, 0.8);
      }

      h1 {
        font-weight: 700;
        font-size: clamp(24px, 6.5vw, 38px);
        line-height: 1.5;
        max-width: 18em;
        text-shadow: 0 0 30px rgba(255, 122, 168, 0.6);
      }

      p.sub {
        font-weight: 300;
        font-size: clamp(15px, 4vw, 18px);
        line-height: 1.9;
        color: var(--blush);
        max-width: 28em;
        margin-top: 14px;
      }

      .envelope {
        font-size: clamp(84px, 24vw, 128px);
        line-height: 1;
        animation: float 3s ease-in-out infinite;
        filter: drop-shadow(0 0 28px rgba(255, 122, 168, 0.9));
        cursor: pointer;
        background: none;
        border: 0;
        padding: 12px;
      }

      @keyframes float {
        50% {
          transform: translateY(-14px) rotate(-3deg);
        }
      }

      .btn {
        font-family: inherit;
        font-weight: 600;
        font-size: 17px;
        color: #fff;
        border: 0;
        border-radius: 999px;
        cursor: pointer;
        padding: 15px 34px;
        background: linear-gradient(135deg, #ff7aa8, #ff4f8b);
        box-shadow: 0 8px 30px rgba(255, 79, 139, 0.55);
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .btn:hover {
        transform: scale(1.05);
      }

      .btn:focus-visible,
      .nope:focus-visible,
      #mute:focus-visible,
      input:focus-visible,
      .envelope:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 3px;
      }

      .field {
        margin: 26px 0 22px;
        width: min(380px, 86vw);
        background: rgba(255, 255, 255, 0.1);
        border: 1.5px solid rgba(255, 214, 227, 0.5);
        border-radius: 999px;
        padding: 6px 8px;
        backdrop-filter: blur(6px);
      }

      .field input {
        width: 100%;
        background: transparent;
        border: 0;
        outline: none;
        text-align: center;
        color: #fff;
        font-family: inherit;
        font-size: 19px;
        padding: 11px 14px;
      }

      .field input::placeholder {
        color: rgba(255, 214, 227, 0.65);
      }

      #line {
        min-height: 4.5em;
        font-size: clamp(20px, 5.4vw, 29px);
        font-weight: 600;
        line-height: 1.7;
        max-width: 20em;
        text-shadow: 0 0 22px rgba(255, 122, 168, 0.7);
      }

      #line::after {
        content: '|';
        margin-left: 3px;
        animation: blink 1s steps(1) infinite;
        color: var(--rose);
      }

      @keyframes blink {
        50% {
          opacity: 0;
        }
      }

      .heartbeat {
        font-size: clamp(68px, 19vw, 100px);
        line-height: 1.1;
        animation: beat 1.3s ease-in-out infinite;
        filter: drop-shadow(0 0 26px #ff4f8b);
      }

      @keyframes beat {
        0%,
        100% {
          transform: scale(1);
        }
        14% {
          transform: scale(1.2);
        }
        28% {
          transform: scale(1);
        }
        42% {
          transform: scale(1.12);
        }
      }

      .choices {
        position: relative;
        display: flex;
        gap: 16px;
        justify-content: center;
        align-items: center;
        margin-top: 32px;
        flex-wrap: wrap;
        min-height: 64px;
      }

      .btn.yes {
        font-size: 20px;
        padding: 16px 40px;
        animation: pulse 1.8s infinite;
      }

      @keyframes pulse {
        0% {
          box-shadow: 0 0 0 0 rgba(255, 122, 168, 0.7);
        }
        100% {
          box-shadow: 0 0 0 22px rgba(255, 122, 168, 0);
        }
      }

      .nope {
        font-family: inherit;
        font-size: 15px;
        color: var(--blush);
        background: rgba(255, 255, 255, 0.12);
        border: 1px solid rgba(255, 214, 227, 0.45);
        border-radius: 999px;
        padding: 13px 24px;
        cursor: pointer;
        transition: transform 0.2s, background 0.2s;
      }

      .nope:hover {
        background: rgba(255, 255, 255, 0.18);
      }

      .letter {
        background: rgba(255, 243, 247, 0.11);
        border: 1px solid rgba(255, 214, 227, 0.45);
        border-radius: 22px;
        padding: 26px 24px;
        max-width: 26em;
        backdrop-filter: blur(8px);
        box-shadow: 0 0 60px rgba(255, 122, 168, 0.3);
        font-size: clamp(15px, 4.2vw, 18px);
        line-height: 2;
        margin-top: 16px;
      }

      .letter b {
        color: var(--gold);
      }

      #mute {
        position: fixed;
        top: calc(14px + env(safe-area-inset-top, 0px));
        right: 14px;
        z-index: 5;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(255, 214, 227, 0.5);
        background: rgba(255, 255, 255, 0.14);
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        display: none;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition-duration: 0.01s !important;
        }
      }
    </style>
  </head>
  <body>
    <canvas id="fx"></canvas>
    <div class="glow"></div>
    <button id="mute" aria-label="เปิดหรือปิดเสียงเพลง">🔊</button>
    <audio id="bgm" src="music.mp3" loop preload="auto"></audio>

    <!-- 1 ซองจดหมาย -->
    <section class="scene on" id="s1">
      <button class="envelope" id="open" aria-label="รับพัสดุ">📦</button>
      <p class="script" style="margin-top: 18px">special delivery</p>
      <p class="sub">
        มีพัสดุชิ้นเล็ก ๆ ส่งถึงด้าย<br />แตะที่กล่องเพื่อเปิดอ่านได้เลยนะ
      </p>
    </section>

    <!-- 2 ใส่ชื่อ (Netlify Form) -->
    <section class="scene" id="s2">
      <h1>ลงชื่อผู้รับพัสดุ 📝</h1>
      <p class="sub">
        ส่งตรงแบบน่ารัก ๆ<br />พิมพ์ชื่อเล่นก่อนเปิดดูข้างในได้เลย
      </p>
      <form name="parcel-note" method="POST" data-netlify="true" id="authForm">
        <input type="hidden" name="form-name" value="parcel-note" />
        <input type="hidden" name="answer" id="answerField" value="" />
        <div class="field">
          <input
            type="text"
            id="nameInput"
            name="recipient_name"
            placeholder="ชื่อผู้รับ"
            required
            autocomplete="off"
          />
        </div>
        <button class="btn" type="submit">ยืนยันรับพัสดุ</button>
      </form>
      <div id="check" class="sub" style="display: none; line-height: 2.2"></div>
    </section>

    <!-- 3 ข้อความทีละบรรทัด -->
    <section class="scene" id="s3">
      <div class="script" id="hi" style="margin-bottom: 26px"></div>
      <div id="line"></div>
    </section>

    <!-- 4 ชวนคุยต่อแบบสบาย ๆ -->
    <section class="scene" id="s4">
      <div class="heartbeat">💗</div>
      <h1 style="margin-top: 18px" id="ask"></h1>
      <p class="sub">ไม่ต้องรีบตอบเลยนะ แค่อยากชวนยิ้ม 😊</p>
      <div class="choices" id="choices">
        <button class="btn yes" id="yes">คุยกันต่อนะ 😊</button>
        <button class="nope" id="slow">ค่อย ๆ คุยกันไป 🌷</button>
      </div>
    </section>

    <!-- 5 การ์ดปิดท้าย -->
    <section class="scene" id="s5">
      <div class="heartbeat">🥹💖</div>
      <p class="script" style="margin-top: 10px">a little note for you</p>
      <div class="letter" id="finalLetter"></div>
    </section>

    <script>
      const $ = id => document.getElementById(id)
      const wait = ms => new Promise(r => setTimeout(r, ms))
      const bgm = $('bgm')
      const mute = $('mute')

      // ถ้าอยากข้ามหน้ากรอกชื่อ ให้ใส่ 'น้องด้าย' ลงไป ถ้าเว้นว่าง '' จะให้กรอกชื่อก่อน
      const TARGET_NAME = ''
      let userName = ''

      function show(id) {
        document
          .querySelectorAll('.scene')
          .forEach(s => s.classList.toggle('on', s.id === id))
      }

      function sendNetlify(payload) {
        return fetch('/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            'form-name': 'parcel-note',
            ...payload
          }).toString()
        }).catch(() => {})
      }

      /* ---------- กลีบซากุระและหัวใจลอย ---------- */
      const cv = $('fx')
      const cx = cv.getContext('2d')
      let W, H
      let bits = []

      function resize() {
        const dpr = Math.min(devicePixelRatio || 1, 2)
        W = cv.width = innerWidth * dpr
        H = cv.height = innerHeight * dpr
      }

      addEventListener('resize', resize)
      resize()

      const glyphs = ['🌸', '💗', '✨', '💕', '🌸']

      function spawn(burst) {
        const dpr = Math.min(devicePixelRatio || 1, 2)
        bits.push({
          x: Math.random() * W,
          y: burst ? H * 1.05 : -40,
          s: (14 + Math.random() * 20) * dpr,
          vy: (burst ? -1 : 1) * (0.5 + Math.random() * 1.3) * dpr,
          vx: (Math.random() - 0.5) * 0.75 * dpr,
          r: Math.random() * 6,
          vr: (Math.random() - 0.5) * 0.025,
          g: glyphs[Math.floor(Math.random() * glyphs.length)],
          a: 0.35 + Math.random() * 0.5
        })
      }

      let rate = 0.12
      ;(function loop() {
        cx.clearRect(0, 0, W, H)
        if (Math.random() < rate && bits.length < 85) spawn(false)
        bits = bits.filter(b => b.y > -80 && b.y < H + 80)
        for (const b of bits) {
          b.x += b.vx + Math.sin(b.y / 90) * 0.45
          b.y += b.vy
          b.r += b.vr
          cx.save()
          cx.translate(b.x, b.y)
          cx.rotate(b.r)
          cx.globalAlpha = b.a
          cx.font = `${b.s}px serif`
          cx.textAlign = 'center'
          cx.fillText(b.g, 0, 0)
          cx.restore()
        }
        requestAnimationFrame(loop)
      })()

      function risingHearts(n) {
        for (let i = 0; i < n; i++) setTimeout(() => spawn(true), i * 45)
      }

      /* ---------- พิมพ์ข้อความทีละตัว ---------- */
      async function type(el, text, speed = 65) {
        el.textContent = ''
        for (const ch of text) {
          el.textContent += ch
          await wait(speed)
        }
      }

      /* ---------- ฉาก 1 → 2 ---------- */
      $('open').onclick = () => {
        bgm.volume = 0
        bgm.play().catch(() => {})
        let v = 0
        const f = setInterval(() => {
          v = Math.min(0.8, v + 0.05)
          bgm.volume = v
          if (v >= 0.8) clearInterval(f)
        }, 140)
        mute.style.display = 'block'
        rate = 0.3

        if (TARGET_NAME) {
          userName = TARGET_NAME
          sendNetlify({
            recipient_name: userName,
            answer: 'เปิดพัสดุแล้ว'
          })
          story()
        } else {
          show('s2')
          setTimeout(() => $('nameInput').focus(), 800)
        }
      }

      mute.onclick = () => {
        if (bgm.paused) {
          bgm.play().catch(() => {})
          mute.textContent = '🔊'
        } else {
          bgm.pause()
          mute.textContent = '🔇'
        }
      }

      /* ---------- ฉาก 2 → 3 ---------- */
      $('authForm').addEventListener('submit', e => {
        e.preventDefault()
        userName = $('nameInput').value.trim()
        if (!userName) return
        sendNetlify({
          recipient_name: userName,
          answer: 'ยืนยันชื่อผู้รับแล้ว'
        })
        fakeCheck()
      })

      async function fakeCheck() {
        $('authForm').style.display = 'none'
        const c = $('check')
        c.style.display = 'block'
        c.innerHTML = ''
        const steps = [
          'กำลังเช็กชื่อผู้รับพัสดุ...',
          'เจอรหัสพัสดุ 1 ชิ้น ✅',
          'ข้างในมีข้อความเล็ก ๆ รออยู่นะ 💌'
        ]
        for (const t of steps) {
          c.append(t, document.createElement('br'))
          await wait(1000)
        }
        await wait(450)
        story()
      }

      async function story() {
        show('s3')
        await wait(1000)
        $('hi').textContent = 'ถึง ' + userName + ' 🌷'
        await wait(1200)
        const lines = [
          'จริง ๆ เราก็เพิ่งเริ่มได้คุยกันเองเนอะ',
          'แต่เรารู้สึกดีนะ ที่ได้รู้จักกัน',
          'บางทีแค่ได้คุยกันนิดหน่อย\nก็ทำให้วันธรรมดาดูน่าสนใจขึ้นเลย',
          'เลยอยากส่งข้อความเล็ก ๆ นี้มาให้ 😊'
        ]
        const el = $('line')
        for (const t of lines) {
          el.style.whiteSpace = 'pre-line'
          await type(el, t, 65)
          await wait(1600)
        }
        proposal()
      }

      /* ---------- ฉาก 4 ---------- */
      async function proposal() {
        show('s4')
        rate = 0.45
        await wait(850)
        $('ask').textContent = 'ให้เราได้คุยกับ ' + userName + ' ไปเรื่อย ๆ ได้ไหม?'
      }

      /* ปุ่มเลือกแบบน่ารัก ๆ ไม่วิ่งหนีจนหงุดหงิด */
      const yes = $('yes')
      const slow = $('slow')
      let nudge = 0

      slow.onclick = () => {
        nudge++
        if (nudge === 1) {
          slow.textContent = 'แอบชวนคุยต่ออีกนิดนะ 😊'
          yes.style.transform = 'scale(1.08)'
          return
        }
        finish(
          'yes (ค่อย ๆ คุยกันไป)',
          `ได้เลยนะ <b>${userName}</b> 🌷<br />` +
            'ไม่ต้องรีบอะไรเลย ค่อย ๆ คุย ค่อย ๆ รู้จักกันไป<br />' +
            'ขอบคุณที่แวะมาอ่านข้อความนี้<br />' +
            '<b>ขอให้วันนี้เป็นวันที่น่ารักนะ</b> ✨'
        )
      }

      function finish(answerLabel, message) {
        $('answerField').value = answerLabel
        sendNetlify({
          recipient_name: userName || TARGET_NAME || 'ไม่ระบุชื่อ',
          answer: answerLabel
        })
        $('finalLetter').innerHTML = message
        show('s5')
        rate = 0.7
        risingHearts(55)

        const heart = confetti.shapeFromText
          ? confetti.shapeFromText({ text: '💖', scalar: 2.6 })
          : 'circle'
        const end = Date.now() + 4000

        ;(function shoot() {
          confetti({
            particleCount: 4,
            angle: 60,
            spread: 65,
            origin: { x: 0, y: 0.75 },
            shapes: [heart],
            scalar: 2.6,
            colors: ['#ff7aa8', '#ffd6e3', '#ffd28a']
          })
          confetti({
            particleCount: 4,
            angle: 120,
            spread: 65,
            origin: { x: 1, y: 0.75 },
            shapes: [heart],
            scalar: 2.6,
            colors: ['#ff7aa8', '#ffd6e3', '#ffd28a']
          })
          if (Date.now() < end) requestAnimationFrame(shoot)
        })()
      }

      yes.onclick = () =>
        finish(
          'yes (คุยกันต่อ)',
          `เย้ ขอบคุณนะ <b>${userName}</b> 😊💗<br />` +
            'ดีใจที่ด้ายอยากคุยกันต่อนะ<br />' +
            'ค่อย ๆ แลกเรื่องราวดี ๆ กันไปทีละนิด<br />' +
            '<b>ยินดีที่ได้รู้จักกันนะ</b> 🌷'
        )
    </script>
  </body>
</html>
